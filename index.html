<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab - Hidrostática II (12 Retos)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 0% { transform: translateY(105vh) rotate(0deg); } 100% { transform: translateY(-105vh) rotate(360deg); } }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(15px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes confettiExplosion { 0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } }
        @keyframes jellyPop { 0% { transform: scale3d(.3, .3, .3); opacity: 0; } 20% { transform: scale3d(1.05, 1.05, 1.05); } 40% { transform: scale3d(.95, .95, .95); } 60% { transform: scale3d(1.02, 1.02, 1.02); opacity: 1; } 80% { transform: scale3d(.98, .98, .98); } 100% { transform: scale3d(1, 1, 1); opacity: 1; } }
        @keyframes fadeInRow { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fadeInRow { animation: fadeInRow 0.3s ease-out forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }

        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.7rem, 1.3vw, 1rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(0.9rem, 1.8vw, 1.2rem) !important; color: #ffffff !important; }
        .math-row .katex { font-size: clamp(1rem, 2vw, 1.4rem) !important; color: #0f172a !important; }
        .math-row-final .katex { font-size: clamp(1.2rem, 2.5vw, 1.8rem) !important; color: #0f172a !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Anchor = (p) => <Icon {...p} paths='<circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;
        const CheckCircle = (p) => <Icon {...p} paths='<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' />;

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const HYDRO_EXERCISES = [
            {
                id: 1,
                title: "Pág. 4 - Ejercicio 1",
                subtitle: "Empuje Total",
                cardGradient: "from-blue-500/30 to-indigo-600/30 border-blue-400",
                badgeColor: "bg-blue-500",
                enunciadoText: "Un bloque de plástico de volumen 0,4 m³ está completamente sumergido en un líquido (ρ = 800 kg/m³). Determine el empuje (g = 10 m/s²).",
                steps: [
                    { latex: String.raw`E = \rho_L \cdot g \cdot V_{sum}`, propertyText: "Fórmula Empuje", robotSpeech: "El empuje de Arquímedes depende de la densidad del líquido y el volumen sumergido." },
                    { latex: String.raw`V_{sum} = 0.4\text{ m}^3`, propertyText: "Volumen sumergido", robotSpeech: "Como el bloque está COMPLETAMENTE sumergido, el volumen sumergido es igual al volumen total." },
                    { latex: String.raw`E = 800 \cdot 10 \cdot 0.4`, propertyText: "Reemplazando datos", robotSpeech: "Sustituimos la densidad (800), la gravedad (10) y el volumen (0.4) en la fórmula." },
                    { latex: String.raw`E = \mathbf{3200\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "¡Multiplicamos todo y obtenemos que el líquido ejerce una fuerza de 3200 Newtons hacia arriba!" }
                ]
            },
            {
                id: 2,
                title: "Pág. 4 - Ejercicio 2",
                subtitle: "Empuje Parcial",
                cardGradient: "from-emerald-500/30 to-teal-600/30 border-emerald-400",
                badgeColor: "bg-emerald-500",
                enunciadoText: "Un tronco de 0,8 m³ flota con la mitad sumergida en agua (ρ = 1000 kg/m³). Determine el empuje. (g = 10 m/s²).",
                steps: [
                    { latex: String.raw`E = \rho_{\text{agua}} \cdot g \cdot V_{sum}`, propertyText: "Fórmula Empuje", robotSpeech: "Usaremos la fórmula del empuje hidrostático." },
                    { latex: String.raw`V_{sum} = \frac{0.8}{2} = 0.4\text{ m}^3`, propertyText: "Mitad Sumergida", robotSpeech: "¡Cuidado aquí! El tronco FLOTA con la mitad sumergida, así que dividimos el volumen entre 2." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.4`, propertyText: "Sustitución", robotSpeech: "Reemplazamos con la densidad del agua que siempre es 1000 kg/m³." },
                    { latex: String.raw`E = \mathbf{4000\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "Operamos y descubrimos que el agua empuja al tronco con 4000 N." }
                ]
            },
            {
                id: 3,
                title: "Pág. 5 - Ejercicio 3",
                subtitle: "Volumen Porcentual",
                cardGradient: "from-cyan-500/30 to-blue-600/30 border-cyan-400",
                badgeColor: "bg-cyan-500",
                enunciadoText: "Una boya de 0,08 m³ flota con el 60% sumergido en el mar (ρ = 1000 kg/m³). Determine el empuje. (g = 10).",
                steps: [
                    { latex: String.raw`E = \rho_{\text{mar}} \cdot g \cdot V_{sum}`, propertyText: "Principio Arquímedes", robotSpeech: "Nuevamente, el empuje depende solo de la parte que está hundida en el agua." },
                    { latex: String.raw`V_{sum} = 60\% \cdot 0.08 = 0.048\text{ m}^3`, propertyText: "Cálculo del 60%", robotSpeech: "Sacamos el 60% del volumen total. Multiplicamos 0.60 por 0.08." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.048`, propertyText: "Reemplazando", robotSpeech: "Ponemos los datos en la ecuación." },
                    { latex: String.raw`E = \mathbf{480\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "Al multiplicar, los ceros recorren la coma y nos queda exactamente 480 N." }
                ]
            },
            {
                id: 4,
                title: "Pág. 5 - Ejercicio 4",
                subtitle: "Tensión de Cuerda",
                cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400",
                badgeColor: "bg-amber-500",
                enunciadoText: "Bloque de 12 kg y 0,01 m³ suspendido y sumergido en agua. Determine la lectura del dinamómetro (Tensión). (g=10)",
                steps: [
                    { latex: String.raw`\sum F(\uparrow) = \sum F(\downarrow) \Rightarrow T + E = F_g`, propertyText: "DCL y Equilibrio", robotSpeech: "Hacemos un Diagrama de Cuerpo Libre. Hacia arriba tiran la cuerda (T) y el Empuje (E). Abajo el peso (Fg)." },
                    { latex: String.raw`F_g = m \cdot g = 12 \cdot 10 = 120\text{ N}`, propertyText: "Cálculo del Peso", robotSpeech: "Calculamos el peso del bloque multiplicando su masa por la gravedad." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.01 = 100\text{ N}`, propertyText: "Cálculo del Empuje", robotSpeech: "Calculamos el empuje. Está todo sumergido, usamos el volumen total de 0.01 m³." },
                    { latex: String.raw`T = 120 - 100 = \mathbf{20\text{ N}}`, propertyText: "Despejando T", robotSpeech: "Despejamos la tensión T = Peso - Empuje. ¡El dinamómetro marca 20 N (peso aparente)!" }
                ]
            },
            {
                id: 5,
                title: "Pág. 5 - Ejercicio 5",
                subtitle: "Dinámica en Fluidos",
                cardGradient: "from-pink-500/30 to-rose-600/30 border-pink-400",
                badgeColor: "bg-pink-500",
                enunciadoText: "Pelota de 0,4 kg y 0,005 m³ se suelta en aceite (ρ = 800 kg/m³). Determine la aceleración. (g=10).",
                steps: [
                    { latex: String.raw`E = 800 \cdot 10 \cdot 0.005 = 40\text{ N}`, propertyText: "Fuerza de Empuje", robotSpeech: "Primero hallamos el Empuje hacia arriba. ¡Sale 40 N!" },
                    { latex: String.raw`F_g = m \cdot g = 0.4 \cdot 10 = 4\text{ N}`, propertyText: "Peso de la Pelota", robotSpeech: "El peso hacia abajo es solo 4 N. ¡El empuje gana por mucho!" },
                    { latex: String.raw`F_R = m \cdot a \Rightarrow E - F_g = m \cdot a`, propertyText: "Segunda Ley Newton", robotSpeech: "Como sube, la fuerza resultante es Empuje menos Peso. Igualamos a masa por aceleración." },
                    { latex: String.raw`40 - 4 = 0.4 \cdot a \Rightarrow a = \mathbf{90\text{ m/s}^2}`, propertyText: "Resultado Final", robotSpeech: "Restamos (36) y pasamos el 0.4 a dividir. ¡Sale disparada con 90 m/s²!" }
                ]
            },
            {
                id: 6,
                title: "Pág. 5 - Ejercicio 6",
                subtitle: "Dos Líquidos",
                cardGradient: "from-purple-500/30 to-violet-600/30 border-purple-400",
                badgeColor: "bg-purple-500",
                enunciadoText: "Esfera V = 4×10⁻³ m³ en equilibrio exacto entre la mitad del líquido A (ρ=800) y líquido B (ρ=600). Halle la masa.",
                steps: [
                    { latex: String.raw`F_g = E_A + E_B`, propertyText: "Equilibrio Total", robotSpeech: "Al estar en equilibrio, el peso se compensa con la suma de los empujes de ambos líquidos." },
                    { latex: String.raw`V_A = V_B = \frac{4\times10^{-3}}{2} = 2\times10^{-3}\text{ m}^3`, propertyText: "Volúmenes Mitades", robotSpeech: "El gráfico muestra que está sumergida exactamente a la mitad en cada líquido." },
                    { latex: String.raw`m \cdot 10 = 800(10)(2\cdot10^{-3}) + 600(10)(2\cdot10^{-3})`, propertyText: "Reemplazando todo", robotSpeech: "Sustituimos el peso (mg) y los dos empujes (densidad * g * volumen)." },
                    { latex: String.raw`10m = 16 + 12 \Rightarrow m = \mathbf{2.8\text{ kg}}`, propertyText: "Resultado Final", robotSpeech: "Operamos con cuidado los exponentes. Sumamos y dividimos entre 10. ¡Masa = 2.8 kg!" }
                ]
            },
            {
                id: 7,
                title: "Pág. 6 - Ejercicio 1",
                subtitle: "Empuje Básico",
                cardGradient: "from-indigo-500/30 to-blue-600/30 border-indigo-400",
                badgeColor: "bg-indigo-500",
                enunciadoText: "Un bloque de plástico de 0,5 m³ está completamente sumergido en líquido (ρ = 700 kg/m³). Halle empuje.",
                steps: [
                    { latex: String.raw`E = \rho_{\text{liq}} \cdot g \cdot V_{sum}`, propertyText: "Fórmula Empuje", robotSpeech: "Iniciamos recordando la fórmula fundamental de la hidrostática." },
                    { latex: String.raw`V_{sum} = 0.5\text{ m}^3`, propertyText: "Sumergido Total", robotSpeech: "El bloque se encuentra hundido en su totalidad." },
                    { latex: String.raw`E = 700 \cdot 10 \cdot 0.5`, propertyText: "Sustitución", robotSpeech: "Colocamos la densidad (700), gravedad (10) y volumen (0.5)." },
                    { latex: String.raw`E = \mathbf{3500\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "Calculamos el producto y obtenemos 3500 Newtons." }
                ]
            },
            {
                id: 8,
                title: "Pág. 6 - Ejercicio 2",
                subtitle: "Tercera Parte",
                cardGradient: "from-fuchsia-500/30 to-pink-600/30 border-fuchsia-400",
                badgeColor: "bg-fuchsia-500",
                enunciadoText: "Tronco de madera V = 1,2 m³ flota con la tercera parte sumergida en agua (ρ=1000). Halle empuje. (g=10).",
                steps: [
                    { latex: String.raw`E = \rho_{\text{agua}} \cdot g \cdot V_{sum}`, propertyText: "Ecuación Base", robotSpeech: "Volvemos a usar la ecuación del Empuje." },
                    { latex: String.raw`V_{sum} = \frac{1.2}{3} = 0.4\text{ m}^3`, propertyText: "Fracción Sumergida", robotSpeech: "Como dice 'tercera parte', dividimos el volumen total entre 3." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.4`, propertyText: "Reemplazo", robotSpeech: "Ingresamos la densidad del agua que es 1000." },
                    { latex: String.raw`E = \mathbf{4000\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "La multiplicación nos da como resultado 4000 Newtons." }
                ]
            },
            {
                id: 9,
                title: "Pág. 7 - Ejercicio 3",
                subtitle: "Flotación al 50%",
                cardGradient: "from-teal-500/30 to-emerald-600/30 border-teal-400",
                badgeColor: "bg-teal-500",
                enunciadoText: "Boya de 0,06 m³ flota con el 50% de volumen sumergido en el mar (ρ = 1000 kg/m³). Halle empuje.",
                steps: [
                    { latex: String.raw`E = \rho_{\text{mar}} \cdot g \cdot V_{sum}`, propertyText: "Arquímedes", robotSpeech: "Para el empuje, solo nos interesa lo que está bajo el agua." },
                    { latex: String.raw`V_{sum} = 50\% \cdot 0.06 = 0.03\text{ m}^3`, propertyText: "Cálculo 50%", robotSpeech: "El 50% es exactamente la mitad, así que es 0.03 m³." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.03`, propertyText: "Sustituyendo", robotSpeech: "Ponemos los datos en la expresión matemática." },
                    { latex: String.raw`E = \mathbf{300\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "El resultado final nos da 300 Newtons de fuerza ascendente." }
                ]
            },
            {
                id: 10,
                title: "Pág. 7 - Ejercicio 4",
                subtitle: "Peso Aparente",
                cardGradient: "from-rose-500/30 to-red-600/30 border-rose-400",
                badgeColor: "bg-rose-500",
                enunciadoText: "Bloque 14 kg y 0,01 m³ suspendido y sumergido en agua. Halle lectura del dinamómetro.",
                steps: [
                    { latex: String.raw`\sum F(\uparrow) = \sum F(\downarrow) \Rightarrow T = F_g - E`, propertyText: "Equilibrio", robotSpeech: "El dinamómetro lee la Tensión, que es igual al Peso menos el Empuje." },
                    { latex: String.raw`F_g = m \cdot g = 14 \cdot 10 = 140\text{ N}`, propertyText: "Peso Real", robotSpeech: "El peso real del bloque en el aire sería 140 N." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.01 = 100\text{ N}`, propertyText: "Fuerza Empuje", robotSpeech: "El agua ejerce un empuje hacia arriba de 100 N." },
                    { latex: String.raw`T = 140 - 100 = \mathbf{40\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "Restamos para hallar el 'peso aparente'. ¡El dinamómetro marca 40 N!" }
                ]
            },
            {
                id: 11,
                title: "Pág. 7 - Ejercicio 5",
                subtitle: "Ascenso Rápido",
                cardGradient: "from-sky-500/30 to-cyan-600/30 border-sky-400",
                badgeColor: "bg-sky-500",
                enunciadoText: "Pelota de 0,8 kg y 0,005 m³ en aceite (ρ = 800 kg/m³). Determine aceleración al soltarla. (g=10)",
                steps: [
                    { latex: String.raw`E = 800 \cdot 10 \cdot 0.005 = 40\text{ N}`, propertyText: "Calculando Empuje", robotSpeech: "Empezamos hallando la fuerza que empuja hacia arriba. Da 40 N." },
                    { latex: String.raw`F_g = 0.8 \cdot 10 = 8\text{ N}`, propertyText: "Calculando Peso", robotSpeech: "El peso es masa por gravedad, nos da 8 N." },
                    { latex: String.raw`E - F_g = m \cdot a`, propertyText: "2da Ley de Newton", robotSpeech: "Como el empuje es mayor, la pelota acelera hacia la superficie." },
                    { latex: String.raw`40 - 8 = 0.8 \cdot a \Rightarrow a = \mathbf{40\text{ m/s}^2}`, propertyText: "Resultado Final", robotSpeech: "Restamos (32) y dividimos entre 0.8. ¡Aceleración de 40 m/s²!" }
                ]
            },
            {
                id: 12,
                title: "Pág. 7 - Ejercicio 6",
                subtitle: "Empuje Humano",
                cardGradient: "from-lime-500/30 to-green-600/30 border-lime-400",
                badgeColor: "bg-lime-500",
                enunciadoText: "Un joven de volumen 0,06 m³ flota con el 95% sumergido en agua. Determine el empuje (ρ=1000).",
                steps: [
                    { latex: String.raw`E = \rho_{\text{agua}} \cdot g \cdot V_{sum}`, propertyText: "Fórmula Empuje", robotSpeech: "¡El principio de Arquímedes también aplica para nosotros al nadar!" },
                    { latex: String.raw`V_{sum} = 95\% \cdot 0.06 = 0.057\text{ m}^3`, propertyText: "Volumen al 95%", robotSpeech: "Calculamos cuánto de ese volumen está bajo el agua. 0.95 x 0.06." },
                    { latex: String.raw`E = 1000 \cdot 10 \cdot 0.057`, propertyText: "Sustitución", robotSpeech: "Reemplazamos la densidad (1000), gravedad (10) y volumen sumergido." },
                    { latex: String.raw`E = \mathbf{570\text{ N}}`, propertyText: "Resultado Final", robotSpeech: "¡El agua empuja al joven con una fuerza de 570 Newtons!" }
                ]
            }
        ];

        const MathDisplay = memo(({ latex, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try { window.katex.render(latex, containerRef.current, { displayMode: true, throwOnError: false, strict: false, trust: true }); } 
                    catch (e) { containerRef.current.innerText = latex; }
                }
            }, [latex]);
            return (
                <div className={`relative w-full flex justify-center items-center ${className}`}>
                    <div ref={containerRef} className="w-full text-center" />
                </div>
            );
        });

        const FloatingBackground = memo(() => {
            const symbols = ['ρ', 'E', 'g', 'V', 'F', 'kg/m³', 'N', 'm³', '%'];
            const elements = Array.from({ length: 30 }).map((_, i) => ({
                id: i, symbol: symbols[Math.floor(Math.random() * symbols.length)], left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`, animationDelay: `-${Math.random() * 20}s`,
                fontSize: `${1 + Math.random() * 3}rem`, opacity: 0.1 + Math.random() * 0.15
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none drop-shadow-lg" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>
                            {el.symbol}
                        </div>
                    ))}
                </div>
            );
        });

        const Confetti = memo(() => {
            const colors = ['#fde047', '#60a5fa', '#f472b6', '#34d399', '#a78bfa', '#ff5722'];
            const pieces = Array.from({ length: 120 }).map((_, i) => ({
                id: i, left: `${50 + (Math.random() * 20 - 10)}%`, color: colors[Math.floor(Math.random() * colors.length)],
                tx: `${(Math.random() - 0.5) * 800}px`, ty: `${(Math.random() - 1) * 800}px`, rot: `${Math.random() * 720}deg`, delay: `${Math.random() * 0.2}s`
            }));
            return (
                <div className="absolute inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                    {pieces.map((p) => (
                        <div key={p.id} className="absolute w-4 h-4 sm:w-5 sm:h-5 rounded-full animate-confettiExplosion shadow-sm" style={{ backgroundColor: p.color, '--tx': p.tx, '--ty': p.ty, '--rot': p.rot, animationDelay: p.delay, left: p.left, top: '50%' }} />
                    ))}
                </div>
            );
        });

        const RobotAssistant = ({ step, maxSteps }) => {
            const isFinalStep = step >= maxSteps;
            const isThinking = step === maxSteps - 1;

            const getContainerAnim = () => { if (isFinalStep) return 'animate-robotJump'; if (isThinking) return 'animate-robotThinkTilt'; return 'animate-robotFloat'; };
            const getArmLAnim = () => { if (isFinalStep) return 'rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmL'; return 'rotate-45'; };
            const getArmRAnim = () => { if (isFinalStep) return '-rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmR'; return '-rotate-45'; };
            
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1.5"><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-2"><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1.5"><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-6 h-3.5 bg-rose-400 rounded-b-full mt-1.5"></div>;
                if (step === 0) return <div className="w-4 h-1.5 bg-cyan-300 rounded-full mt-2"></div>;
                return <div className="w-3.5 h-3.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-lg select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-3.5 h-3.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-4 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-white to-slate-200 rounded-[1.2rem] border-[3px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1.5">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1.5 shadow-inner border-2 border-indigo-500">
                            {getEyes()} {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);

            const currentExercise = HYDRO_EXERCISES[exIdx];
            const maxSteps = currentExercise.steps.length - 1;
            const currentStepData = currentExercise.steps[step];

            const getVisibleSteps = () => {
                // MODIFICADO: Cambiamos a -3 para asegurar que se vean 4 pasos (0,1,2,3)
                const start = Math.max(0, step - 3);
                return currentExercise.steps.slice(start, step + 1).map((data, index) => ({
                    ...data,
                    originalIndex: start + index,
                    isCurrent: (start + index) === step
                }));
            };

            const handleInteraction = () => AudioController.init();

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) AudioController.play('success');
                    else AudioController.play('pop');
                } else {
                    if (exIdx < HYDRO_EXERCISES.length - 1) {
                        AudioController.play('swoosh');
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        AudioController.play('swoosh');
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => { handleInteraction(); setIsMuted(AudioController.toggleMute()); };

            if (view === 'home') {
                return (
                    <div className="w-screen min-h-[100dvh] bg-gradient-to-br from-[#0284c7] via-[#3b82f6] to-[#059669] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto overflow-x-hidden scrollbar-hide">
                        <FloatingBackground />
                        
                        <div className="w-full max-w-7xl z-20 flex items-center justify-between mb-8 mt-2">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-sm sm:text-base">
                                <Anchor className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} className="p-2 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        <div className="relative z-10 text-center w-full max-w-7xl flex flex-col items-center">
                            <h1 className="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-black text-white mb-3 drop-shadow-[0_6px_0_rgba(0,0,0,0.3)] tracking-tight leading-none uppercase">
                                Hidrostática <span className="text-yellow-300 underline decoration-wavy decoration-teal-400">II</span>
                            </h1>
                            <p className="text-base sm:text-xl lg:text-2xl text-blue-100 mb-8 font-bold max-w-3xl leading-relaxed">
                                Domina el Principio de Arquímedes con 12 ejercicios paso a paso 🌊🚢
                            </p>

                            <div className="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5 mb-12">
                                {HYDRO_EXERCISES.map((ex, idx) => (
                                    <button
                                        key={ex.id}
                                        onClick={() => startExercise(idx)}
                                        className="group text-left p-3 sm:p-4 rounded-[1.5rem] bg-gradient-to-br bg-opacity-90 backdrop-blur-xl border-[3px] border-white/40 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(0,0,0,0.3)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[9rem] sm:min-h-[11rem]"
                                        style={{ backgroundImage: `linear-gradient(to bottom right, var(--tw-gradient-stops))` }}
                                    >
                                        <div className={`absolute inset-0 opacity-80 ${ex.cardGradient}`}></div>
                                        <div className="relative z-10 flex-1 flex flex-col h-full">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className={`${ex.badgeColor} text-white text-[10px] sm:text-xs font-black px-2 py-1 rounded-md uppercase tracking-widest shadow-sm`}>
                                                    Reto {ex.id}
                                                </span>
                                                <span className="bg-black/20 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md">
                                                    {ex.steps.length} pasos
                                                </span>
                                            </div>
                                            <div className="flex-1 my-2 bg-white/95 rounded-xl p-2 sm:p-3 text-slate-900 shadow-inner overflow-hidden flex items-center justify-center border border-white/60 w-full pointer-events-none math-card">
                                                <MathDisplay latex={ex.steps[0].latex} />
                                            </div>
                                            <div className="text-white text-xs sm:text-sm font-black flex items-center justify-between mt-1 h-8">
                                                <span className="leading-tight drop-shadow-md pr-1 line-clamp-2">{ex.subtitle}</span>
                                                <span className="bg-yellow-400 text-slate-900 w-5 h-5 rounded-full flex items-center justify-center font-black group-hover:translate-x-1 transition-transform shrink-0 shadow-sm text-xs">➔</span>
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#0f172a] via-[#1e3a8a] to-[#0f766e] text-slate-800 flex flex-col p-2 sm:p-4 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    <div className="shrink-0 relative z-10 w-full max-w-6xl mx-auto flex justify-between items-center mb-3 px-1">
                        <button onClick={() => { AudioController.play('swoosh'); setView('home'); }} className="flex items-center justify-center px-4 py-2 sm:px-5 sm:py-2.5 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-sm sm:text-base hover:scale-105">
                            <Home className="w-5 h-5 sm:mr-2" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1 bg-black/30 p-1.5 rounded-[1rem] border-2 border-white/20 backdrop-blur-md shadow-lg overflow-x-auto scrollbar-hide max-w-[50vw]">
                            {HYDRO_EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`shrink-0 w-8 h-8 sm:w-10 sm:h-10 rounded-[0.8rem] font-black text-xs sm:text-sm transition-all ${exIdx === i ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_10px_rgba(250,204,21,0.6)] mx-1' : 'text-white hover:bg-white/20'}`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} className="p-2 sm:p-3 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95 hover:scale-105">
                            {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                        </button>
                    </div>

                    <div className="flex-1 min-h-0 relative z-10 w-full max-w-6xl mx-auto bg-white rounded-[2rem] sm:rounded-[2.5rem] border-[6px] sm:border-[8px] border-slate-100 shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
                        
                        <div className="shrink-0 bg-slate-900 border-b-[6px] border-blue-500 px-4 py-3 sm:px-6 sm:py-4 flex flex-col items-center justify-center relative shadow-md">
                            <div className="flex items-center gap-3 mb-2">
                                <span className="bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm px-3 py-1 rounded-md uppercase tracking-widest shadow-sm">
                                    {currentExercise.title}
                                </span>
                                <span className="text-blue-200 font-bold text-xs sm:text-sm bg-white/10 px-3 py-1 rounded-md">
                                    {currentExercise.subtitle}
                                </span>
                            </div>
                            <div className="text-white font-bold text-sm sm:text-base md:text-lg text-center w-full max-w-4xl leading-snug">
                                {currentExercise.enunciadoText}
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col p-2 sm:p-4 relative bg-slate-50 overflow-hidden w-full h-full">
                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(#475569_2px,transparent_2px)] [background-size:30px_30px] pointer-events-none"></div>

                            <div className="flex flex-col justify-end w-full h-full z-10 space-y-2 sm:space-y-3">
                                {getVisibleSteps().map((row, idx) => (
                                    <div 
                                        key={`row-${exIdx}-${row.originalIndex}`} 
                                        className={`w-full flex items-center justify-between gap-2 sm:gap-3 p-2.5 sm:p-4 rounded-2xl sm:rounded-3xl border-2 transition-all animate-fadeInRow ${row.originalIndex === maxSteps ? 'bg-[#fde047] border-[#eab308] shadow-[0_5px_20px_rgba(234,179,8,0.4)]' : row.isCurrent ? 'bg-white border-blue-300 shadow-md' : 'bg-slate-100/50 border-slate-200 opacity-70'}`}
                                    >
                                        <div className="w-1/3 sm:w-1/4 shrink-0">
                                            <span className={`inline-flex w-full items-center justify-center gap-1.5 px-2 py-1.5 sm:px-3 sm:py-2 rounded-xl font-bold text-xs sm:text-sm text-center ${row.originalIndex === maxSteps ? 'bg-amber-400 text-slate-900' : row.isCurrent ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white' : 'bg-slate-300 text-slate-700'}`}>
                                                {row.originalIndex === maxSteps ? <CheckCircle className="w-4 h-4 hidden sm:block" /> : <Sparkles className="w-4 h-4 hidden sm:block" />} 
                                                <span className="line-clamp-2">{row.propertyText}</span>
                                            </span>
                                        </div>
                                        <div className={`flex-1 flex justify-center items-center overflow-x-auto scrollbar-hide px-2 ${row.originalIndex === maxSteps ? 'math-row-final' : 'math-row'}`}>
                                            <MathDisplay latex={row.latex} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="shrink-0 bg-white w-full px-4 py-3 sm:px-8 sm:py-4 flex items-center gap-4 border-t-[6px] border-slate-100 z-10 relative">
                            <div className="shrink-0 absolute -top-12 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-sm sm:text-lg font-bold text-slate-700 leading-snug bg-blue-50/80 p-3 sm:p-4 rounded-[1rem] sm:rounded-[1.2rem] border-2 border-blue-100 min-h-[4rem] flex items-center shadow-sm ml-[4.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {currentStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        <div className="shrink-0 bg-gradient-to-b from-[#dbeafe] to-[#bfdbfe] p-3 sm:p-5 w-full flex flex-col items-center border-t-[6px] border-white z-10">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-3 h-12 sm:h-14">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#93c5fd] border-b-[4px] border-[#3b82f6] text-[#1e3a8a] rounded-l-2xl rounded-r-xl font-black text-sm sm:text-xl flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[4px] disabled:opacity-40 transition-all hover:bg-[#bfdbfe]"
                                >
                                    <ChevronLeft className="w-5 h-5 sm:w-7 sm:h-7 stroke-[4px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>

                                <div className="bg-[#3b82f6] text-white font-black px-4 sm:px-6 text-base sm:text-xl flex items-center justify-center rounded-2xl border-b-[4px] border-[#2563eb] shadow-inner whitespace-nowrap">
                                    Paso {step}/{maxSteps}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[4px] text-white rounded-r-2xl rounded-l-xl font-black text-base sm:text-2xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[4px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#f59e0b] to-[#f97316] border-[#c2410c]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? 'Siguiente'
                                            : exIdx < HYDRO_EXERCISES.length - 1
                                            ? `Reto ${exIdx + 2}`
                                            : 'Volver'}
                                    </span>
                                    <ChevronRight className="w-5 h-5 sm:w-7 sm:h-7 stroke-[4px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
